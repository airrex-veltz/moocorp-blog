name: Fiction Safety

on:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'scripts/check-fiction-safety.mjs'
      - '.github/workflows/fiction-safety.yml'
  pull_request:
    paths:
      - 'src/content/**'
      - 'scripts/check-fiction-safety.mjs'
      - '.github/workflows/fiction-safety.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-fiction-safety.mjs --strict
